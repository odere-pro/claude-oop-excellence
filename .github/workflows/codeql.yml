name: codeql

# CodeQL SAST over the `actions` language (a content-only plugin has no compiled code, so this scans
# the workflow YAML itself). DORMANT by default: uploading results to code-scanning requires a PUBLIC
# repo (or GitHub Advanced Security). Once your repo is public, uncomment the push/pull_request/schedule
# triggers to activate it. See the cookbook's 14-supply-chain-and-governance.

on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]
  # pull_request:
  #   branches: ["main"]
  # schedule:
  #   - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
