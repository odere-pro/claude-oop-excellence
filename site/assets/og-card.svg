<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="claude-oop-excellence — enforce good object-oriented design in any language">
  <defs>
    <radialGradient id="glow" cx="78%" cy="-6%" r="85%">
      <stop offset="0%" stop-color="#e0855f" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#e0855f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#221b18" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- brand -->
  <text x="80" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#f0e7df">claude-</tspan><tspan fill="#e0855f">oop-excellence</tspan>
  </text>

  <!-- headline -->
  <text x="80" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#f0e7df">
    <tspan x="80" dy="0">Enforce good object-</tspan>
    <tspan x="80" dy="86">oriented design — in</tspan>
    <tspan x="80" dy="86">any language.</tspan>
  </text>

  <!-- subline -->
  <text x="82" y="512" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" fill="#b9a99c">
    audit → fix → verify · RISK + PATTERN tracks · one unified report
  </text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#f0e7df">
    <rect x="80" y="556" width="190" height="46" rx="23" fill="#31261f" stroke="#5c5048" />
    <text x="100" y="585">102 entities</text>
    <rect x="286" y="556" width="262" height="46" rx="23" fill="#31261f" stroke="#5c5048" />
    <text x="306" y="585">test-verified fixes</text>
    <rect x="564" y="556" width="216" height="46" rx="23" fill="#31261f" stroke="#5c5048" />
    <text x="584" y="585">principle-based</text>
  </g>

  <!-- object-graph mark, top-right -->
  <g transform="translate(1000, 150)">
    <line x1="0" y1="-44" x2="-58" y2="44" stroke="#5c5048" stroke-width="13" stroke-linecap="round" />
    <line x1="0" y1="-44" x2="58" y2="44" stroke="#5c5048" stroke-width="13" stroke-linecap="round" />
    <rect x="-30" y="-74" width="60" height="60" rx="14" fill="#e0855f" />
    <rect x="-88" y="14" width="56" height="56" rx="13" fill="#e0855f" />
    <rect x="32" y="14" width="56" height="56" rx="13" fill="#e0855f" />
  </g>
</svg>
